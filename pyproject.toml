[project]
name = "recallops"
version = "0.1.0"
description = "On-call incident response copilot that learns from every incident, powered by Hindsight memory and Band."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hindsight-client>=0.4",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "band-sdk[langgraph]>=8.1.0",
    "langchain-openai>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
